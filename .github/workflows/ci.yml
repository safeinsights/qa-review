name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per branch/PR; newer pushes cancel older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from the "packageManager" field in package.json, so CI
      # and local machines cannot drift (a pnpm 9 runner reads "overrides" from a
      # different file than pnpm 11 and rejects the lockfile).
      # node-version must stay >= 22: pnpm 11 requires Node >=22.13 (it imports
      # node:sqlite, absent in 20). 22 also matches the Node the packaged app
      # bundles (NODE_VERSION in scripts/build-app.sh), so CI tests what ships.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  engine:
    name: Engine (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The engine's vitest suite runs keyless: with no age identity present,
      # loadSettings() skips encrypted values, so no secrets are needed in CI.
      - run: pnpm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  go:
    name: Go GUI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gui/frontend/pnpm-lock.yaml
      # v6+ is required: v5 reads ONLY the `go` line from go.mod and ignores the
      # `toolchain` directive, so it would install 1.25.x. The build would still
      # reach 1.26.6 through GOTOOLCHAIN=auto, but re-downloading it uncached on
      # every run — and `go version` would report the wrong Go.
      - uses: actions/setup-go@v6
        with:
          go-version-file: gui/go.mod
          cache-dependency-path: gui/go.sum
      # gui/main.go embeds `all:frontend/dist`, so the Go package won't compile
      # until the frontend is built into that (gitignored) directory.
      - name: Build frontend (for go:embed)
        working-directory: gui/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: go test ./...
        working-directory: gui

      # Catches what `go test` cannot: stdlib and dependency CVEs. Unlike a
      # version-range scanner it reports only vulnerabilities our code actually
      # calls, so a finding here is real work rather than noise to triage. The
      # five stdlib CVEs that prompted the toolchain pin were invisible until
      # this ran, so gate on it to stop them coming back.
      - name: govulncheck
        working-directory: gui
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
